[project]
name = "warframe-set-arbitrage"
version = "0.1.0"
description = "Set vs. parts spreads on warframe.market for unvaulted and Prime Resurgence primes"
readme = "README.md"
authors = [
    { name = "Lucas Caetano" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[project.scripts]
warframe-set-arbitrage = "warframe_set_arbitrage:main"
wfspread = "warframe_set_arbitrage:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
